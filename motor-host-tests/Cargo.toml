[package]
name = "motor-wasi-tests"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
wasmtime = { path = "../crates/wasmtime", default-features = false, features = ["std", "runtime", "pulley", "component-model-async", "component-model-bytes", "gc", "gc-drc"] }
wasmtime-wasi = { path = "../crates/wasi", features = ["p1", "p2", "p3"] }
[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = "0.17"
moto-sys = "0.3.2"
[patch.crates-io]
target-lexicon = { git = "https://github.com/moturus/target-lexicon", branch = "motor-0.13.5" }
tokio = { git = "https://github.com/moturus/tokio", branch = "motor-1.51.1" }
mio = { git = "https://github.com/moturus/mio", branch = "motor-1.2.0" }
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
